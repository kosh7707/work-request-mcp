[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wr-mcp"
version = "0.1.0"
description = "MCP server for inter-session WR (work-request) messaging in Claude Code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kosh7707" }]
dependencies = [
    "mcp>=1.0,<2",
    "pyyaml>=6",
    "filelock>=3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "build",
    "twine",
]

[project.scripts]
wr-mcp = "wr_mcp.server:main"

[project.urls]
Homepage = "https://github.com/kosh7707/work-request-mcp"
Repository = "https://github.com/kosh7707/work-request-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/wr_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
